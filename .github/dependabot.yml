# Dependabot version updates, read by GitHub from the default branch. Each update
# arrives as a pull request and runs through CI.

version: 2
updates:
  # The npm ecosystem also covers pnpm projects.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Releases must be this many days old before an update is proposed.
    cooldown:
      default-days: 7
    # Minor and patch updates share one pull request. Major updates get their own.
    groups:
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint requires TypeScript below 6.1.
      - dependency-name: typescript
        versions: ['>=6.1.0']

  # Updates the commit SHAs and version comments in workflow files.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
