# Publishes a release when a version tag such as v0.1.0 is pushed. Runs every CI
# check, confirms the tag matches package.json, builds the extension and attaches
# the zip to a GitHub Release. If Chrome Web Store credentials are configured as
# repository secrets, the zip is also uploaded to the store as a draft. It is never
# published automatically.

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Needed to create the release.
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: pnpm run build

      - name: Zip the extension
        # Source maps are left out of the store package.
        run: cd dist && zip -r "../stoop-$GITHUB_REF_NAME.zip" . -x '*.map'

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "stoop-$GITHUB_REF_NAME.zip"
          --title "$GITHUB_REF_NAME" --generate-notes

      - name: Keep the zip for the store upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-zip
          path: stoop-${{ github.ref_name }}.zip
          retention-days: 7

  web-store:
    name: Chrome Web Store draft
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    steps:
      - name: Skip without store credentials
        if: env.REFRESH_TOKEN == ''
        run: echo "No Chrome Web Store credentials are configured, so the upload is skipped."

      - name: Download the zip
        if: env.REFRESH_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-zip

      - name: Upload as a draft
        if: env.REFRESH_TOKEN != ''
        # The upload command only uploads. Publishing stays a manual step in the
        # developer dashboard.
        run: npx --yes chrome-webstore-upload-cli@4.0.2 upload --source "stoop-$GITHUB_REF_NAME.zip"
